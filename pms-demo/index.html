<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hearth &amp; Key PMS Demo</title>
  <meta name="description" content="Interactive demo of Hearth & Key PMS: front office, booking engine, POS, inventory, requisitions, HR, accounting, assets, events and automated reports." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f2a2e'/><text x='50%' y='58%' text-anchor='middle' font-family='Georgia' font-size='34' fill='%23c9a45c'>H</text></svg>" />
</head>
<body>
  <div class="demo-banner">
    <span><b>Demo</b> with sample data for a fictional hotel. Changes are saved in this browser only.</span>
    <button type="button" data-action="reset-demo">Reset demo data</button>
    <a href="../pms.html">← Back to website</a>
  </div>

  <div class="app">
    <aside class="side" aria-label="Modules">
      <div class="brand"><span class="mark">H</span><span>Hearth &amp; Key <em>PMS</em></span></div>
      <nav id="side-nav"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" type="button" data-action="toggle-nav" aria-label="Show modules">☰</button>
        <div class="prop">
          <b>Lakeview Hotel &amp; Suites</b>
          <span id="biz-date"></span>
        </div>
        <div class="top-actions">
          <button class="btn btn-ghost" type="button" data-action="night-audit" title="Post tonight's room charges and move to the next business day">Run night audit</button>
          <span class="user" title="Signed in as">GM · General Manager</span>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-wrap" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><h2 id="modal-title"></h2><button type="button" class="x" data-action="close-modal" aria-label="Close">×</button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
